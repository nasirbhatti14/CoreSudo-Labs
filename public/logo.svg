<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Top-left to bottom gradient for ice cyan/blue facets -->
    <linearGradient id="cyanFacetLight" x1="40" y1="30" x2="100" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D5ECF7"/>
      <stop offset="45%" stop-color="#91CBE3"/>
      <stop offset="100%" stop-color="#5B9EB-B" stop-color-fallback="#5B9EBB"/>
    </linearGradient>

    <linearGradient id="cyanFacetMed" x1="100" y1="30" x2="170" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#88C4DE"/>
      <stop offset="100%" stop-color="#417F9F"/>
    </linearGradient>

    <linearGradient id="cyanFacetBottomLeft" x1="30" y1="100" x2="100" y2="170" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#417F9F"/>
      <stop offset="100%" stop-color="#7BB9D4"/>
    </linearGradient>

    <linearGradient id="cyanFacetBottomRight" x1="100" y1="100" x2="170" y2="170" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#88C4DE"/>
      <stop offset="100%" stop-color="#D5ECF7"/>
    </linearGradient>

    <linearGradient id="whiteBand" x1="30" y1="60" x2="170" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="85%" stop-color="#F3F8FA"/>
      <stop offset="100%" stop-color="#D2E7F0"/>
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Dark navy container matching the uploaded logo -->
  <rect width="200" height="200" rx="24" fill="#0A1C2C"/>

  <g filter="url(#shadow)">
    <!-- Top Diamond Bracket -->
    <path d="M 100 34 L 172 96 L 138 96 L 100 62 L 62 96 L 28 96 Z" fill="url(#cyanFacetLight)"/>
    <path d="M 100 34 L 172 96 L 138 96 L 100 62 Z" fill="url(#cyanFacetMed)" opacity="0.88"/>

    <!-- Bottom Diamond Bracket -->
    <path d="M 100 166 L 28 104 L 62 104 L 100 138 L 138 104 L 172 104 Z" fill="url(#cyanFacetBottomRight)"/>
    <path d="M 100 166 L 28 104 L 62 104 L 100 138 Z" fill="url(#cyanFacetBottomLeft)" opacity="0.88"/>

    <!-- Prominent Solid White Diagonal Ribbon -->
    <path d="M 33 63 L 68 63 L 167 137 L 132 137 Z" fill="url(#whiteBand)"/>
  </g>
</svg>
